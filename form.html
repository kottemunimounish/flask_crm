{% extends "base.html" %}
{% block title %}{{ action }} Customer - Simple CRM{% endblock %}
{% block content %}
    <div class="form-box">
        <h2>{{ action }} Customer</h2>
        <form method="POST">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" value="{{ customer['name'] if customer else '' }}" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email" value="{{ customer['email'] if customer else '' }}" required>

            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ customer['phone'] if customer else '' }}">

            <label for="company">Company</label>
            <input type="text" id="company" name="company" value="{{ customer['company'] if customer else '' }}">

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4">{{ customer['notes'] if customer else '' }}</textarea>

            <div style="margin-top:20px;">
                <button type="submit" class="btn btn-primary">{{ action }} Customer</button>
                <a href="{{ url_for('index') }}" class="btn" style="background:#ccc;">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
